    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <style>
      /* HERO FULL-BLEED BACKGROUND */
      .hero-bg {
        --hero-warm: #f2efe8;
        background: var(--hero-warm);
        width: calc(100% + 4rem);
        margin-left: -2rem;
        padding: 2.5rem 2rem 0;
        margin-bottom: 0;
      }
      html[data-theme="dark"] .hero-bg {
        --hero-warm: #1f1c16;
      }

      /* HEADER */
      header {
        display: flex;
        gap: 2.5rem;
        align-items: flex-start;
        padding-bottom: 2rem;
        margin-bottom: 0;
        border-bottom: none;
      }

      header img {
        width: 160px;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
        flex-shrink: 0;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }

      .header-info h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.15rem;
      }

      .header-info h1 .cn-name {
        display: block;
        font-size: 1rem;
        font-weight: 400;
        color: var(--muted);
        margin-top: 0.1rem;
      }

      .header-info .title {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 0.75rem;
        line-height: 1.5;
      }

      .header-info .title strong {
        color: var(--text);
        font-weight: 500;
      }

      .header-info .title .accent-link {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      .header-info .title .accent-link:hover {
        text-decoration: underline;
      }

      .tagline {
        font-style: italic;
        font-size: 1.02rem;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 1rem;
      }

      .contact {
        font-size: 0.88rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .links a {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--accent);
        text-decoration: none;
        padding: 0.3rem 0.75rem;
        border: 1px solid var(--accent);
        border-radius: 999px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .links a svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .links a:hover {
        background: var(--accent);
        color: #fff;
      }
      html[data-theme="dark"] .links a:hover {
        color: #fff;
      }

      /* SECTIONS */
      section {
        margin-bottom: 3rem;
      }

      section h2 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 1.25rem;
        color: var(--text);
      }

      section p {
        color: var(--muted);
        margin-bottom: 1rem;
        font-size: 0.95rem;
      }

      section p a {
        color: var(--accent);
        text-decoration: none;
      }

      section p a:hover {
        text-decoration: underline;
      }

      /* NEWS */
      .news-item {
        display: flex;
        gap: 1.5rem;
        padding: 0.6rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
      }

      .news-item:last-child {
        border-bottom: none;
      }

      .news-date {
        color: var(--muted);
        white-space: nowrap;
        font-size: 0.85rem;
        min-width: 80px;
      }

      /* PAPERS */
      .Certifications {
        padding: 1rem 0;
        border-bottom: 1px solid var(--border);
      }

      .Certifications:last-child {
        border-bottom: none;
      }

      .Certifications-title {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 0.3rem;
      }

      .Certifications-title a {
        color: var(--accent);
        text-decoration: none;
      }

      .Certifications-title a:hover {
        text-decoration: underline;
      }

      .Certifications-authors {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }

      .Certifications-authors strong {
        color: var(--text);
        font-weight: 500;
      }

      .Certifications-venue {
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.1rem 0.4rem;
        border-radius: 3px;
        margin-right: 0.3rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .badge-sigcomm {
        background: #fef3c7;
        color: #92400e;
      }
      .badge-nsdi {
        background: #dbeafe;
        color: #1e40af;
      }
      .badge-eurosys {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-infocom {
        background: #ede9fe;
        color: #5b21b6;
      }
      .badge-other {
        background: #f3f4f6;
        color: #374151;
      }

      /* ACTIVITIES */
      .activity-item {
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
        color: var(--muted);
      }

      .activity-item:last-child {
        border-bottom: none;
      }
      .activity-item a {
        color: var(--accent);
        text-decoration: none;
      }
      .activity-item a:hover {
        text-decoration: underline;
      }

      /* AUTHOR TOGGLE */
      .author-toggle {
        font-size: 0.8rem;
        color: var(--accent);
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
        margin-left: 0.15rem;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
        display: inline;
      }
      .author-toggle:hover {
        text-decoration: underline;
      }

      /* RESPONSIVE */
      @media (max-width: 600px) {
        .hero-bg {
          padding: 1.5rem 1rem 0;
        }
        header {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        header img {
          width: 130px;
          height: 163px;
        }
        .tagline {
          font-size: 0.95rem;
        }
        .contact {
          text-align: center;
        }
        .contact img {
          margin: 0 auto;
        }
        .links {
          justify-content: center;
        }
        h2 {
          font-size: 1rem;
        }
      }
    </style>
